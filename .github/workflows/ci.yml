name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the E2A framework (single source of the E2A classes)
        uses: actions/checkout@v6
        with:
          repository: subhamviky/e2a-framework
          ref: v1.6.1
          path: e2a-framework
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the package
        run: pip install ".[api]"
      - name: Packaging check (the installed package, not the checkout)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c "from a2c_assets import read_template; assert 'aws_sqs_queue' in read_template('terraform/aws.tf'); import a2c_cli, a2c_template_llm; print('package OK')"
          aidlc-build --help | head -1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install e2a-java from the E2A checkout (smoke_test_java12 builds a generated project against it)
        run: mvn -B -q -f e2a-framework/java/pom.xml install -DskipTests
      - name: E2A conformance (v1.3 is strict by default; R2 and D1 are errors)
        run: python -m e2a.conformance $(git ls-files '*.py' | grep -v '^smoke_test')
      - name: Run the smoke tests
        shell: bash
        env:
          E2A_REFERENCE_PATH: ${{ github.workspace }}/e2a-framework/reference
        run: |
          for t in smoke_test_generator_concurrency smoke_test_g2c_contract smoke_test_a2c smoke_test_aidlc_integration smoke_test_template_mode smoke_test_declarations smoke_test_g2c_v12 smoke_test_evaluation smoke_test_java12 smoke_test_profile_binding; do
            echo "== $t"
            python -W always "$t.py" > "$RUNNER_TEMP/$t.log" 2>&1; rc=$?
            tail -1 "$RUNNER_TEMP/$t.log"
            test "$rc" -eq 0 || { tail -40 "$RUNNER_TEMP/$t.log"; exit 1; }
            # v1.3 preparation (V13-01): nothing may run on E2A's v1.1 adapters. Match E2A's own
            # DeprecationWarning, not "removed in v1.3": A2C's build report says that too, on purpose
            if grep "uses the v1.1 keyword signature" "$RUNNER_TEMP/$t.log"; then echo "::error::$t uses E2A's v1.1 adapters"; exit 1; fi
          done

  images:
    # P-4 (v1.1.2): the generated Dockerfiles are built AND started, so a container
    # that cannot run (like the v1.1.0 venv path) fails here, not in a project.
    runs-on: ubuntu-latest
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - request: examples/requests/python-gcp-service.json
            project: image-py-service
            port: "8000"
            health: /health
          - request: examples/requests/java-azure-service.json
            project: image-java-service
            port: "8080"
            health: /actuator/health
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the package
        run: pip install ".[api]"
      - name: Generate the service
        working-directory: ${{ runner.temp }}
        run: |
          aidlc-build --request "${{ github.workspace }}/${{ matrix.request }}" --output .
          # include_paths of the Python request: the folder must exist for the COPY
          mkdir -p "${{ matrix.project }}/policies" && echo "placeholder" > "${{ matrix.project }}/policies/README.md"
      - name: Build, start and probe the image
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        shell: bash
        run: |
          docker build -t generated:ci .
          docker run -d --name svc -p "${{ matrix.port }}:${{ matrix.port }}" generated:ci
          for _ in $(seq 60); do curl -fs "http://localhost:${{ matrix.port }}${{ matrix.health }}" && break; sleep 2; done
          curl -fs "http://localhost:${{ matrix.port }}${{ matrix.health }}" || { docker logs svc; exit 1; }

  declarations:
    # Wave C note C-02 (v1.2.0): settings, a contract and a secret declared in the request
    # reach Terraform (fmt, test with one assertion per setting) and the code (generated
    # tests), on every cloud; two services in one repository get root workflows (actionlint).
    runs-on: ubuntu-latest
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
      - name: Install the package
        run: pip install ".[api]" pytest
      - name: Generate the service
        working-directory: ${{ runner.temp }}
        run: aidlc-build --request "${{ github.workspace }}/examples/requests/declarations-${{ matrix.cloud }}.json" --output .
      - name: Terraform fmt and test (one assertion per declared setting)
        working-directory: ${{ runner.temp }}/decl-${{ matrix.cloud }}/infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform test
      - name: Generated settings and contract tests
        working-directory: ${{ runner.temp }}/decl-${{ matrix.cloud }}
        run: PYTHONPATH=src python -m pytest -q tests/test_settings.py tests/test_contracts.py
      - name: Several agents in one workflow (G2C for E2A v1.2) - the generated tests pass
        if: matrix.cloud == 'gcp'
        working-directory: ${{ runner.temp }}
        run: |
          aidlc-build --request "${{ github.workspace }}/examples/requests/agents-python.json" --output .
          cd agents-service && PYTHONPATH=src python -m pytest -q
      - name: Monorepo layout - root workflows pass actionlint
        if: matrix.cloud == 'aws'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          mkdir mono && cd mono && git init -q
          for r in declarations-aws java-azure-service; do
            aidlc-build --request "${{ github.workspace }}/examples/requests/$r.json" --output . --repository-layout monorepo
          done
          ls .github/workflows
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
