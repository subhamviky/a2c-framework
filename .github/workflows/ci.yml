name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the E2A framework (single source of the E2A classes)
        uses: actions/checkout@v6
        with:
          repository: subhamviky/e2a-framework
          ref: v1.1.2
          path: e2a-framework
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the package
        run: pip install ".[api]"
      - name: Packaging check (the installed package, not the checkout)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c "from a2c_assets import read_template; assert 'aws_sqs_queue' in read_template('terraform/aws.tf'); import a2c_cli, a2c_template_llm; print('package OK')"
          aidlc-build --help | head -1
      - name: Run the smoke tests
        shell: bash
        env:
          E2A_REFERENCE_PATH: ${{ github.workspace }}/e2a-framework/reference
        run: |
          for t in smoke_test_generator_concurrency smoke_test_g2c_contract smoke_test_a2c smoke_test_aidlc_integration smoke_test_template_mode; do
            echo "== $t"
            python "$t.py" | tail -1
          done

  images:
    # P-4 (v1.1.2): the generated Dockerfiles are built AND started, so a container
    # that cannot run (like the v1.1.0 venv path) fails here, not in a project.
    runs-on: ubuntu-latest
    needs: smoke-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - request: examples/requests/python-gcp-service.json
            project: image-py-service
            port: "8000"
            health: /health
          - request: examples/requests/java-azure-service.json
            project: image-java-service
            port: "8080"
            health: /actuator/health
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the package
        run: pip install ".[api]"
      - name: Generate the service
        working-directory: ${{ runner.temp }}
        run: |
          aidlc-build --request "${{ github.workspace }}/${{ matrix.request }}" --output .
          # include_paths of the Python request: the folder must exist for the COPY
          mkdir -p "${{ matrix.project }}/policies" && echo "placeholder" > "${{ matrix.project }}/policies/README.md"
      - name: Build, start and probe the image
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        shell: bash
        run: |
          docker build -t generated:ci .
          docker run -d --name svc -p "${{ matrix.port }}:${{ matrix.port }}" generated:ci
          for _ in $(seq 60); do curl -fs "http://localhost:${{ matrix.port }}${{ matrix.health }}" && break; sleep 2; done
          curl -fs "http://localhost:${{ matrix.port }}${{ matrix.health }}" || { docker logs svc; exit 1; }
