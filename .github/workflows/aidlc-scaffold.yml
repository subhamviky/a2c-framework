name: aidlc-scaffold (reusable)

# Reusable workflow (A2C v1.1.2; root workflows for monorepos since v1.2.0): runs aidlc-build (E2A AI-DLC pipeline: G2C + P0, then A2C,
# then E2A checks) for one request file of the CALLING repository and pushes the generated
# service to the branch aidlc/<project_name> there.
# v1.5.0 (AD-01): the commit's AUTHOR is the person who started the run (the bot is only the
# committer), with the Assisted-by and AIDLC-Run trailers and a change record; GitHub signs it
# (pushed through its API) unless `signed: false`; the run's log is kept as an artifact.
# Call it from a project repository:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         request: {description: "AI-DLC request file", required: true}
#   jobs:
#     scaffold:
#       permissions:
#         contents: write
#       uses: subhamviky/a2c-framework/.github/workflows/aidlc-scaffold.yml@v1.5.0
#       with:
#         request: ${{ inputs.request }}
#         a2c_ref: v1.5.0
on:
  workflow_call:
    inputs:
      request:
        description: "AI-DLC request file, relative to the calling repository's root"
        required: true
        type: string
      a2c_ref:
        description: "a2c-framework tag to build with"
        required: true
        type: string
      layout:
        description: "monorepo: the generated workflows run from the repository root, scoped to the service; single: they stay in the service folder"
        required: false
        type: string
        default: "monorepo"
      signed:
        description: "for repositories that require signed commits: GitHub authors and signs the commit, the developer becomes Co-authored-by (default: a plain push, the developer is the author)"
        required: false
        type: boolean
        default: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUEST: ${{ inputs.request }}
      A2C_REF: ${{ inputs.a2c_ref }}
      LAYOUT: ${{ inputs.layout }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Java (the G2C critic compiles generated Java)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install aidlc-build
        run: pip install "a2c-framework @ git+https://github.com/subhamviky/a2c-framework.git@${A2C_REF}"

      - name: Who started the run (the commit's author)
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.triggering_actor }}
        run: |
          echo "AIDLC_DEVELOPER_LOGIN=$LOGIN" >> "$GITHUB_ENV"
          echo "AIDLC_DEVELOPER_ID=$(gh api "users/$LOGIN" --jq .id)" >> "$GITHUB_ENV"

      - name: Build the service and commit it as the developer
        id: build
        run: |
          project=$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['context']['project_name'])" "$REQUEST")
          if [ -e "$project" ]; then
            echo "::error::$project already exists; delete it first or use another project_name"
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # monorepo (v1.2): the generated workflows move to the root, scoped to the service
          aidlc-build --request "$REQUEST" --output . --repository-layout "$LAYOUT" --commit 2> "$RUNNER_TEMP/aidlc-run.log"
          cat "$RUNNER_TEMP/aidlc-run.log" >&2

      - name: Push the scaffold to aidlc/<project>
        env:
          PROJECT: ${{ steps.build.outputs.project }}
          BASE: ${{ steps.build.outputs.base }}
          SIGNED: ${{ inputs.signed }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            python -m a2c_signed_push --branch "aidlc/$PROJECT" --base "$BASE"
          else
            git push origin "aidlc/$PROJECT"
          fi

      - name: Keep the run's log (audit)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aidlc-run-${{ github.run_id }}
          path: ${{ runner.temp }}/aidlc-run.log
          if-no-files-found: ignore
