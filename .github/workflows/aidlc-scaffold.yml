name: aidlc-scaffold (reusable)

# Reusable workflow (A2C v1.1.2): runs aidlc-build (E2A AI-DLC pipeline: G2C + P0, then A2C,
# then E2A checks) for one request file of the CALLING repository and pushes the generated
# service to the branch aidlc/<project_name> there. Call it from a project repository:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         request: {description: "AI-DLC request file", required: true}
#   jobs:
#     scaffold:
#       permissions:
#         contents: write
#       uses: subhamviky/a2c-framework/.github/workflows/aidlc-scaffold.yml@v1.1.2
#       with:
#         request: ${{ inputs.request }}
#         a2c_ref: v1.1.2
on:
  workflow_call:
    inputs:
      request:
        description: "AI-DLC request file, relative to the calling repository's root"
        required: true
        type: string
      a2c_ref:
        description: "a2c-framework tag to build with"
        required: true
        type: string
      layout:
        description: "monorepo: move the generated per-service workflows to docs/ (only root workflows run)"
        required: false
        type: string
        default: "monorepo"

jobs:
  scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUEST: ${{ inputs.request }}
      A2C_REF: ${{ inputs.a2c_ref }}
      LAYOUT: ${{ inputs.layout }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Java (the G2C critic compiles generated Java)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install aidlc-build
        run: pip install "a2c-framework @ git+https://github.com/subhamviky/a2c-framework.git@${A2C_REF}"

      - name: Build the service
        id: build
        run: |
          project=$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['context']['project_name'])" "$REQUEST")
          if [ -e "$project" ]; then
            echo "::error::$project already exists; delete it first or use another project_name"
            exit 1
          fi
          aidlc-build --request "$REQUEST" --output .
          if [ "$LAYOUT" = "monorepo" ] && [ -d "$project/.github/workflows" ]; then
            mkdir -p "$project/docs/aidlc/generated-workflows"
            mv "$project"/.github/workflows/*.yml "$project/docs/aidlc/generated-workflows/"
            rm -rf "$project/.github"
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Push the scaffold to aidlc/<project>
        env:
          PROJECT: ${{ steps.build.outputs.project }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "aidlc/$PROJECT"
          git add "$PROJECT"
          git commit -m "scaffold: $PROJECT generated by aidlc-build (a2c-framework $A2C_REF)"
          git push origin "aidlc/$PROJECT"
